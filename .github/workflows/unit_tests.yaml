---
on:
  pull_request:
    paths:
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: unit tests
jobs:
  golang:
    timeout-minutes: 25
    strategy:
      matrix:
        go-version: ['1.27.x']
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Go build and test cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # No services: blocks needed. make test starts one Postgres and one Redis
      # itself, and the suite's own pgtest/redistest helpers provision containers
      # for anything invoked outside it — so the real backends are exercised here
      # rather than silently skipped, which is how they previously reached zero
      # coverage. GitHub runners ship Docker, so this needs no extra setup.
      - name: run unit tests
        run: make test
